name: Generate GitHub Stats

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Generate Streak Stats Card
        run: |
          curl -o streak-stats.svg "https://github-readme-stats-red-theta-53.vercel.app/api/streak?username=Manthan283&theme=tokyonight&hide_border=true"

      - name: Generate Top Languages Card
        run: |
          curl -o top-langs.svg "https://github-readme-stats-red-theta-53.vercel.app/api/top-langs/?username=Manthan283&layout=compact&theme=tokyonight&count_private=true&hide_border=true"

      - name: Commit and Push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add .
          git commit -m "Update GitHub stats" || echo "No changes"
          git push
