name: Generate GitHub Stats

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Generate Stats SVG
        run: |
          curl -o github-stats.svg "https://github-readme-stats-red-theta-53.vercel.app/api?username=Manthan283&show_icons=true&include_all_commits=true&count_private=true&theme=tokyonight"

      - name: Generate Top Languages SVG
        run: |
          curl -o top-langs.svg "https://github-readme-stats-red-theta-53.vercel.app/api/top-langs/?username=Manthan283&layout=compact&theme=tokyonight&count_private=true"

      - name: Commit and Push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add .
          git commit -m "Update GitHub stats" || echo "No changes"
          git push
